name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Kode hasil generate harus up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - run: flutter analyze

      # sync_e2e_test otomatis di-skip karena SUPABASE_URL/SUPABASE_KEY tidak diatur.
      - run: flutter test
