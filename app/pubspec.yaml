name: djournal
description: "Jurnal harian dan catatan keuangan"
publish_to: 'none'
version: 0.9.2+11

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  google_sign_in: ^6.2.2
  googleapis: ^17.0.0
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  sqlite3: ^3.5.2
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mascot/
  # Poppins dibundel (lisensi OFL, assets/fonts/OFL.txt): tanpa internet,
  # dan tiap ketebalan memakai file aslinya, bukan tebal tiruan.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Icon app. Sumbernya SVG di tool/icon/; cara membuat ulang ada di
# tool/render_icons_test.dart.
flutter_launcher_icons:
  image_path: tool/icon/out/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#CDEBDD"
  adaptive_icon_foreground: tool/icon/out/icon_foreground.png
  # Foreground sudah berupa kanvas 108dp lengkap dengan area aman.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: tool/icon/out/icon.png
    background_color: "#CDEBDD"
    theme_color: "#1F5F4E"

# Splash bawaan Android (tampil selama app loading). Animasinya dilanjutkan
# oleh SplashOverlay di Flutter dengan warna dan posisi kucing yang sama.
# Buat ulang: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#CDEBDD"
  image: tool/icon/out/splash.png
  # Mode gelap: latar halaman gelap app, kucing sama.
  color_dark: "#111513"
  image_dark: tool/icon/out/splash.png
  android_12:
    color: "#CDEBDD"
    image: tool/icon/out/splash.png
    color_dark: "#111513"
    image_dark: tool/icon/out/splash.png
  android: true
  ios: false
  web: false
