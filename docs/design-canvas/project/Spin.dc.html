<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Permainan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/dd28f63f6270c6ede0c32193cdae89b5">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.ph{--hero:#1F5F4E;--primary:#1F5F4E;--onprimary:#fff;--psoft:#DCEBE4;--onpsoft:#1F5F4E}
.wheelbox{position:relative;width:288px;height:300px;margin:0 auto}
.pin{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid var(--primary);z-index:3}
.wheel{position:absolute;left:0;top:12px;width:288px;height:288px;border-radius:50%;box-shadow:0 0 0 6px var(--surface),0 10px 28px var(--shadow);transition:transform 3.3s cubic-bezier(.12,.7,.12,1)}
.lab{position:absolute;left:50%;top:50%;width:0;height:0}
.lab span{position:absolute;left:-46px;top:-122px;width:92px;text-align:center;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub{position:absolute;left:50%;top:156px;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:var(--primary)!important;color:var(--onprimary)!important;font-weight:700;font-size:14px;box-shadow:0 0 0 6px var(--surface),0 4px 12px var(--shadow);z-index:2}
.hub:disabled{cursor:default}
.opt{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 12px;border-radius:999px;background:var(--subtle);font-size:12.5px;font-weight:500}
.opt button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.opt svg{width:14px;height:14px}
.rps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rps button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 4px!important;border-radius:20px;background:var(--surface)!important;box-shadow:var(--cardshadow);font-size:12.5px;font-weight:600;min-height:96px}
.rps button.on{background:var(--psoft)!important;color:var(--onpsoft)!important}
.rps svg{width:34px;height:34px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center}
.vs .box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px;border-radius:20px;background:var(--subtle);font-size:12px;color:var(--muted)}
.vs .box svg{width:44px;height:44px;color:var(--ink)}
.vs .box b{font-size:13.5px;color:var(--ink);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="ph {{mode}}" style="height: 1000px; --hero: {{hero}}; --primary: {{primary}}; --onprimary: {{onprimary}}; --psoft: {{psoft}}; --onpsoft: {{onpsoft}}">
<div class="body" style="padding-bottom: 32px">
<div class="hdr">
<a href="Quick.dc.html" class="ib" aria-label="Kembali"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div class="t"><h2 class="s">Permainan</h2><small>Lagi penat? Rehat sebentar bareng Nyaw.</small></div>
</div>
<div class="seg">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}">{{m.n}}</button></sc-for>
</div>

<sc-if value="{{isWheel}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="chips">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4"><button type="button" class="chip {{p.cls}}" onClick="{{p.pick}}">{{p.n}}</button></sc-for>
</div>
<div class="wheelbox">
<div class="pin"></div>
<div class="wheel" style="background: {{wheelBg}}; transform: rotate({{rot}}deg)">
<sc-for list="{{labels}}" as="l" hint-placeholder-count="6"><div class="lab" style="transform: rotate({{l.a}}deg)"><span>{{l.n}}</span></div></sc-for>
</div>
<button type="button" class="hub" onClick="{{spin}}" disabled="{{spinning}}">{{hubText}}</button>
</div>
<div class="card" style="flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px 12px 8px">
<img src="{{mascot}}" alt="{{mascotAlt}}" style="width: 72px; height: 80px; flex: none">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px" aria-live="polite">
<span class="sm">{{resLabel}}</span>
<b style="font-size: 20px; font-weight: 700">{{resText}}</b>
<sc-if value="{{showActions}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
<button type="button" class="btn sm soft" onClick="{{spin}}">Putar lagi</button>
<sc-if value="{{canRecord}}" hint-placeholder-val="{{false}}"><a href="TxForm.dc.html" class="btn sm">Catat pengeluaran</a></sc-if>
</div>
</sc-if>
</div>
</div>
<div class="card">
<div class="ch"><span class="h3">Isi roda</span><span class="sm">{{countText}}</span></div>
<div class="chips">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6"><span class="opt">{{o.n}}<button type="button" aria-label="Hapus {{o.n}}" onClick="{{o.del}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-for>
</div>
<div style="display: flex; gap: 8px">
<label for="spinadd" class="sr">Pilihan baru</label>
<input id="spinadd" class="inp" placeholder="Tambah pilihan, mis. Bakso" maxlength="20" value="{{draft}}" onInput="{{typed}}" onKeyDown="{{enter}}" style="flex: 1; min-width: 0">
<button type="button" class="btn" onClick="{{add}}">Tambah</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isRps}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="card">
<div class="vs" aria-live="polite">
<div class="box">Kamu<svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{meIcon}}"></path></svg><b>{{meName}}</b></div>
<span class="sm" style="font-weight: 600">VS</span>
<div class="box">Nyaw<svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{nyIcon}}"></path></svg><b>{{nyName}}</b></div>
</div>
<div style="display: flex; justify-content: center"><span class="state {{outCls}}">{{outText}}</span></div>
</div>
<div class="rps">
<sc-for list="{{hands}}" as="h" hint-placeholder-count="3"><button type="button" class="{{h.cls}}" onClick="{{h.pick}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{h.d}}"></path></svg>{{h.n}}</button></sc-for>
</div>
<div class="card" style="gap: 8px">
<div class="ch"><span class="h3">Skor</span><button type="button" class="link" onClick="{{resetScore}}">Ulang</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
<div><div class="big" style="font-size: 24px">{{sMe}}</div><span class="sm">Kamu</span></div>
<div><div class="big" style="font-size: 24px">{{sTie}}</div><span class="sm">Seri</span></div>
<div><div class="big" style="font-size: 24px">{{sNy}}</div><span class="sm">Nyaw</span></div>
</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5F4E","options":["#1F5F4E","#1D4E89","#5B3E9E","#A23B4F"]},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.accent ?? '#1F5F4E';
const d = !!this.props.dark;
const m = (x, y, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(x), B = p(y); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const st = this.state || {};
const HAPPY = '/_blob/f54a42e79eddb361c11f6f6e9324cbf6', HELLO = '/_blob/ba41d0d5a61f52bdac32a385f520f688';

const PRE = [
['makan', 'Makan apa?', ['Nasi padang', 'Bakso', 'Mie ayam', 'Soto', 'Ayam geprek', 'Gado-gado']],
['minum', 'Minum apa?', ['Kopi susu', 'Es teh', 'Jus alpukat', 'Air putih']],
['yn', 'Ya / Tidak', ['Ya', 'Tidak']],
['main', 'Mau ngapain?', ['Baca buku', 'Jalan sore', 'Nonton film', 'Tidur siang', 'Beres-beres']]
];
const tab = st.tab || 'wheel';
const pre = st.pre || 'makan';
const lists = st.lists || {};
const opts = lists[pre] || PRE.find((p) => p[0] === pre)[2];
const n = opts.length, seg = 360 / n;
const rot = st.rot || 0, spinning = !!st.spinning, res = st.res ?? null;
const COL = ['var(--psoft)', 'var(--dangersoft)', 'color-mix(in srgb, var(--blue) 18%, var(--surface))', 'var(--warnsoft)', 'color-mix(in srgb, #7E3AA8 16%, var(--surface))', 'color-mix(in srgb, var(--income) 14%, var(--surface))'];
const col = (i) => (i === n - 1 && n > 1 && i % 6 === 0 ? COL[2] : COL[i % 6]);
const setList = (xs) => this.setState({ lists: Object.assign({}, lists, { [pre]: xs }), res: null });
const spin = () => {
if (spinning || n < 2) return;
const k = Math.floor(Math.random() * n);
const t = (k + 0.2 + Math.random() * 0.6) * seg;
this.setState({ rot: rot - (rot % 360) + 360 * 6 + (360 - t), spinning: true, res: null });
setTimeout(() => this.setState({ spinning: false, res: k }), 3400);
};
const add = () => {
const v = (st.draft || '').trim();
if (!v || n >= 12 || spinning || opts.includes(v)) return;
this.setState({ draft: '' });
setList(opts.concat([v]));
};

const Q = 'M9 9a3 3 0 116 0c0 2-3 2.5-3 5M12 18.5v.01';
const H = [
['Batu', 'M7 18.5c-2.5-1.5-3.5-4.5-2.5-7.5S8.5 5.5 12 5.5s6.5 1.5 7.5 4.5-.5 6.5-3 8-6.5 1.5-9.5.5zM9 11.5l2-1.5M13.5 14.5l2.5-.5'],
['Gunting', 'M3 18a3 3 0 106 0 3 3 0 10-6 0M15 18a3 3 0 106 0 3 3 0 10-6 0M8 16L19 4M16 16L5 4'],
['Kertas', 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7']
];
const me = st.me ?? null, ny = st.ny ?? null, counting = !!st.counting;
const sc = st.sc || { w: 0, l: 0, t: 0 };
const out = me === null ? 't0' : counting ? 'c' : ny === me ? 't' : ny === (me + 1) % 3 ? 'w' : 'l';
const OUT = { t0: ['ok', 'Pilih tanganmu'], c: ['ok', 'Batu… gunting… kertas!'], w: ['ok', 'Kamu menang!'], l: ['bad', 'Nyaw menang'], t: ['warn', 'Seri, coba lagi'] };
const play = (k) => () => {
if (counting) return;
this.setState({ me: k, ny: null, counting: true });
setTimeout(() => {
const y = Math.floor(Math.random() * 3);
const o = y === k ? 't' : y === (k + 1) % 3 ? 'w' : 'l';
const s = Object.assign({ w: 0, l: 0, t: 0 }, (this.state || {}).sc);
s[o] += 1;
this.setState({ ny: y, counting: false, sc: s });
}, 700);
};

const done = !spinning && res !== null;
return {
mode: d ? 'dark' : '', hero: a, primary: d ? m(a, '#ffffff', 0.45) : a, onprimary: d ? m(a, '#000000', 0.62) : '#ffffff', psoft: d ? m(a, '#1A1F1D', 0.68) : m(a, '#ffffff', 0.84), onpsoft: d ? m(a, '#ffffff', 0.6) : a,
modes: [['wheel', 'Roda putar'], ['rps', 'Batu gunting kertas']].map(([k, t]) => ({ n: t, cls: k === tab ? 'on' : '', pick: () => { if (!spinning && !counting) this.setState({ tab: k }); } })),
isWheel: tab === 'wheel', isRps: tab === 'rps',
presets: PRE.map((p) => ({ n: p[1], cls: p[0] === pre ? 'on' : '', pick: () => { if (!spinning) this.setState({ pre: p[0], res: null }); } })),
wheelBg: 'conic-gradient(' + opts.map((o, i) => col(i) + ' ' + i * seg + 'deg ' + (i + 1) * seg + 'deg').join(', ') + ')',
rot: rot,
labels: opts.map((o, i) => ({ n: o, a: Math.round((i + 0.5) * seg * 100) / 100 })),
spin: spin, spinning: spinning, hubText: spinning ? '…' : 'Putar',
mascot: done ? HAPPY : HELLO, mascotAlt: done ? 'Nyaw senang' : 'Nyaw melambai',
resLabel: spinning ? 'Muter… muter…' : done ? 'Nyaw pilih' : 'Siap?',
resText: spinning ? 'Tunggu ya' : done ? opts[res] : 'Ketuk Putar',
showActions: done, canRecord: done && (pre === 'makan' || pre === 'minum'),
opts: opts.map((o, i) => ({ n: o, del: () => { if (n > 2 && !spinning) setList(opts.filter((x, j) => j !== i)); } })),
countText: n + ' dari maks 12',
draft: st.draft || '', typed: (e) => this.setState({ draft: e.target.value }), enter: (e) => { if (e.key === 'Enter') add(); }, add: add,
meIcon: me === null ? Q : H[me][1], meName: me === null ? '?' : H[me][0],
nyIcon: ny === null || counting ? Q : H[ny][1], nyName: counting ? '…' : ny === null ? '?' : H[ny][0],
outCls: OUT[out][0], outText: OUT[out][1],
hands: H.map((h, k) => ({ n: h[0], d: h[1], cls: k === me ? 'on' : '', pick: play(k) })),
sMe: String(sc.w), sNy: String(sc.l), sTie: String(sc.t),
resetScore: () => { if (!counting) this.setState({ sc: { w: 0, l: 0, t: 0 }, me: null, ny: null }); }
};
}
}
</script>
</body>
</html>
