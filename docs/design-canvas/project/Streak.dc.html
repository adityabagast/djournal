<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Streak</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/dd28f63f6270c6ede0c32193cdae89b5">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.ph{--hero:#1F5F4E;--primary:#1F5F4E;--onprimary:#fff;--psoft:#DCEBE4;--onpsoft:#1F5F4E}
.fl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.fl span{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--track);color:var(--faint)}
.fl span.lit{background:var(--flamesoft);color:var(--flame)}
.fl svg{width:18px;height:18px;fill:currentColor;stroke:none}
.task{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:10px 0;width:100%;text-align:left;min-height:44px}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .ck{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.task.done{color:var(--muted);text-decoration:line-through}
</style>
</helmet>
<div class="ph {{mode}}" style="height: 844px; --hero: {{hero}}; --primary: {{primary}}; --onprimary: {{onprimary}}; --psoft: {{psoft}}; --onpsoft: {{onpsoft}}">
<div class="body">
<div class="hdr"><div class="t"><small>Rabu, 21 Oktober 2026</small><h2>Hari Ini</h2></div></div>
<div class="ghostcard" style="height: 130px"></div>
<div class="ghostcard" style="height: 200px"></div>
</div>
<a href="Today.dc.html" class="veil" aria-label="Tutup"></a>
<div class="sheet">
<div class="grip"></div>
<div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px">
<img src="/_blob/f54a42e79eddb361c11f6f6e9324cbf6" alt="Nyaw senang" style="width: 96px; height: 106px">
<h3>{{count}} hari berturut-turut</h3>
<p class="sub" style="margin: 0">Api tetap menyala selama ada minimal 1 aktivitas per hari.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7"><div class="fl"><span class="{{w.cls}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"></path></svg></span>{{w.n}}</div></sc-for>
</div>
<div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3"><button type="button" class="task {{t.cls}}" onClick="{{t.pick}}"><span class="ck"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="{{t.tick}}"></path></svg></span>{{t.n}}</button></sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5F4E","options":["#1F5F4E","#1D4E89","#5B3E9E","#A23B4F"]},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.accent ?? '#1F5F4E';
const d = !!this.props.dark;
const m = (x, y, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(x), B = p(y); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const st = this.state || {};
const done = st.done || { j: false, t: false, w: false };
const today = done.j || done.t || done.w;
const T = [['j', 'Tulis jurnal'], ['t', 'Catat transaksi'], ['w', 'Menabung untuk wishlist']];
return {
mode: d ? 'dark' : '', hero: a, primary: d ? m(a, '#ffffff', 0.45) : a, onprimary: d ? m(a, '#000000', 0.62) : '#ffffff', psoft: d ? m(a, '#1A1F1D', 0.68) : m(a, '#ffffff', 0.84), onpsoft: d ? m(a, '#ffffff', 0.6) : a,
count: String(today ? 7 : 6),
week: ['Kam', 'Jum', 'Sab', 'Min', 'Sen', 'Sel', 'Rab'].map((n, i) => ({ n: n, cls: i < 6 || today ? 'lit' : '' })),
tasks: T.map(([k, n]) => ({ n: n, cls: done[k] ? 'done' : '', tick: done[k] ? 'M5 12l5 5 9-10' : '', pick: () => this.setState({ done: Object.assign({}, done, { [k]: !done[k] }) }) }))
};
}
}
</script>
</body>
</html>
